const KEY="ftrack_v5";

function loadState(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const p=JSON.parse(r);
      if(!p.categories)p.categories=CATS;
      if(!p.budgets)p.budgets={};
      if(!p.apiKey)p.apiKey="";
      if(!p.investments)p.investments=[];
      if(!p.savingsGoals)p.savingsGoals=[];
      if(!p.openingBalances)p.openingBalances={};
      if(!p.uploadHistory)p.uploadHistory=[];
      if(!p.invTypes)p.invTypes=[];
      if(!p.debts)p.debts=[];
      return p;
    }
  }catch(e){console.error("Load error",e);}
  return{transactions:[],categories:CATS,budgets:{},apiKey:"",investments:[],savingsGoals:[],openingBalances:{},uploadHistory:[],invTypes:[],debts:[]};
}

function saveState(s){
  try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){console.error("Save error",e);}
}

const fmt=n=>"N"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>"u"+Date.now()+Math.random().toString(36).slice(2,6);

function sortMonths(ms){
  const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return[...ms].sort((a,b)=>{
    const pa=a.split(" "),pb=b.split(" ");
    const ya=parseInt(pa[pa.length-1]||"2026"),yb=parseInt(pb[pb.length-1]||"2026");
    const ma=MN.indexOf(pa[0].split("-")[0]),mb=MN.indexOf(pb[0].split("-")[0]);
    return ya!==yb?ya-yb:ma-mb;
  });
}

function calcMonth(txns,month){
  const rows=txns.filter(t=>t.month===month);
  const income=rows.filter(t=>t.cat==="income").reduce((s,t)=>s+t.amount,0);
  const byCat={};
  rows.filter(t=>t.cat!=="income").forEach(t=>{byCat[t.cat]=(byCat[t.cat]||0)+t.amount;});
  return{income,byCat,expenses:Object.values(byCat).reduce((s,v)=>s+v,0)};
}

function PasswordLock({onUnlock}){
  const[pw,setPw]=useState("");const[err,setErr]=useState("");
  const[setup,setSetup]=useState(!localStorage.getItem("ftrack_pw"));
  const[np,setNp]=useState("");const[cp,setCp]=useState("");
  function tryUnlock(){if(pw===localStorage.getItem("ftrack_pw"))onUnlock();else{setErr("Wrong password.");setPw("");}}
  function createPw(){if(np.length<4){setErr("Min 4 chars.");return;}if(np!==cp){setErr("Passwords dont match.");return;}localStorage.setItem("ftrack_pw",np);onUnlock();}
  const box={minHeight:"100vh",background:"#080814",display:"flex",alignItems:"center",justifyContent:"center"};
  const inner={background:"#111126",borderRadius:20,padding:36,width:340,border:"1px solid #252540",textAlign:"center"};
  if(setup)return h("div",{style:box},h("div",{style:inner},
    h("div",{style:{fontSize:32,marginBottom:10}},"[lock]"),
    h("div",{style:{fontSize:16,fontWeight:800,color:"#fff",marginBottom:4}},"Create Password"),
    h("div",{style:{fontSize:11,color:"#64748b",marginBottom:20}},"Protects your finance tracker"),
    h("input",{type:"password",value:np,onChange:e=>{setNp(e.target.value);setErr("");},placeholder:"Create password (min 4)",style:{...S.inp,marginBottom:8,textAlign:"center"},onKeyDown:e=>e.key==="Enter"&&createPw()}),
    h("input",{type:"password",value:cp,onChange:e=>{setCp(e.target.value);setErr("");},placeholder:"Confirm password",style:{...S.inp,marginBottom:14,textAlign:"center"},onKeyDown:e=>e.key==="Enter"&&createPw()}),
    err&&h("div",{style:{fontSize:11,color:"#ef4444",marginBottom:10}},err),
    h("button",{onClick:createPw,style:{...S.btn(),width:"100%",padding:12}},"Set Password and Enter")
  ));
  return h("div",{style:box},h("div",{style:inner},
    h("div",{style:{fontSize:32,marginBottom:8}},"[money]"),
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#6366f1",fontWeight:700,textTransform:"uppercase",marginBottom:4}},"Oluwafunto Personal Finance"),
    h("div",{style:{fontSize:16,fontWeight:800,color:"#fff",marginBottom:4}},"Expense Tracker"),
    h("div",{style:{fontSize:11,color:"#64748b",marginBottom:20}},"Cycle: 25th to 25th"),
    h("input",{type:"password",value:pw,onChange:e=>{setPw(e.target.value);setErr("");},placeholder:"Enter password",autoFocus:true,style:{...S.inp,marginBottom:12,textAlign:"center",fontSize:15,letterSpacing:4},onKeyDown:e=>e.key==="Enter"&&tryUnlock()}),
    err&&h("div",{style:{fontSize:11,color:"#ef4444",marginBottom:10}},err),
    h("button",{onClick:tryUnlock,style:{...S.btn(),width:"100%",padding:12}},"Unlock")
  ));
}

function AiChat({txns,cats,apiKey,onSaveKey}){
  const[msgs,setMsgs]=useState([{role:"ai",text:"Hi Oluwafunto! Ask me anything about your finances."}]);
  const[input,setInput]=useState("");const[loading,setLoading]=useState(false);
  const[history,setHistory]=useState([]);const[localKey,setLocalKey]=useState(apiKey||"");
  const bottomRef=useRef();
  function buildCtx(){
    const months=sortMonths([...new Set(txns.map(t=>t.month))]);
    return months.map(mk=>{
      const{income,byCat,expenses}=calcMonth(txns,mk);const net=income-expenses;
      var header="== "+mk+" == Income:"+fmt(income)+" Expenses:"+fmt(expenses)+" Net:"+fmt(net);
      var catLines=[];
      cats.filter(function(c){return c.type==="expense";}).forEach(function(c){if(byCat[c.id])catLines.push(c.label+": "+fmt(byCat[c.id]));});
      return header+"\n"+catLines.join("\n");
    }).join("\n");
  }
  async function send(q){
    if(!q.trim())return;
    const key=localKey||apiKey;
    if(!key){setMsgs(m=>[...m,{role:"ai",text:"Please enter your API key above."}]);return;}
    setInput("");setLoading(true);
    const newH=[...history,{role:"user",content:q}];
    setMsgs(m=>[...m,{role:"user",text:q},{role:"ai",text:"Thinking..."}]);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:900,
          system:"You are a personal finance advisor for Oluwafunto in Lagos Nigeria. Be honest and specific. Use NGN. DATA:"+buildCtx(),
          messages:newH})});
      const j=await res.json();
      if(j.error)throw new Error(j.error.message);
      const reply=(j.content||[]).map(i=>i.text||"").join("")||"No response.";
      setHistory([...newH,{role:"assistant",content:reply}]);
      setMsgs(m=>[...m.slice(0,-1),{role:"ai",text:reply}]);
    }catch(err){setMsgs(m=>[...m.slice(0,-1),{role:"ai",text:"Error: "+err.message}]);}
    setLoading(false);
    setTimeout(()=>bottomRef.current&&bottomRef.current.scrollIntoView({behavior:"smooth"}),100);
  }
  const QUICK=["Where am I overspending?","Build me a budget","Savings analysis","Top 3 to cut"];
  return h("div",{style:{display:"flex",flexDirection:"column",height:"100%",background:"#0b0b1e",borderLeft:"1px solid #1e1e38"}},
    h("div",{style:{padding:"12px 14px",borderBottom:"1px solid #1e1e38",background:"#111126",flexShrink:0}},
      h("div",{style:{fontSize:12,fontWeight:800,color:"#a5b4fc"}},"AI Finance Advisor"),
      h("div",{style:{fontSize:10,color:"#475569"}},"Powered by Claude"),
      !apiKey&&h("div",{style:{display:"flex",gap:6,marginTop:8}},
        h("input",{type:"password",placeholder:"Paste API key sk-ant",value:localKey,onChange:e=>setLocalKey(e.target.value),style:{...S.inp,fontSize:10,flex:1}}),
        h("button",{onClick:()=>onSaveKey(localKey),style:{...S.btn(),padding:"6px 10px",fontSize:11}},"Save")
      ),
      apiKey&&h("div",{style:{fontSize:10,color:"#10b981",marginTop:4}},"API key active")
    ),
    h("div",{style:{flex:1,overflowY:"auto",padding:"12px 14px",display:"flex",flexDirection:"column",gap:8}},
      ...msgs.map((m,i)=>h("div",{key:i,style:{maxWidth:"92%",alignSelf:m.role==="user"?"flex-end":"flex-start",padding:"9px 12px",borderRadius:12,fontSize:12,lineHeight:1.65,background:m.role==="user"?"#6366f1":"#1a1a38",color:m.role==="user"?"#fff":"#e2e8f0",whiteSpace:"pre-wrap",wordBreak:"break-word"}},m.text)),
      h("div",{ref:bottomRef})
    ),
    h("div",{style:{padding:"10px 12px",borderTop:"1px solid #1e1e38",flexShrink:0}},
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}},
        ...QUICK.map(q=>h("span",{key:q,onClick:()=>send(q),style:{fontSize:10,padding:"3px 9px",background:"#1a1a38",border:"1px solid #252540",borderRadius:10,color:"#94a3b8",cursor:"pointer"}},q))
      ),
      h("div",{style:{display:"flex",gap:6}},
        h("textarea",{value:input,onChange:e=>setInput(e.target.value),rows:2,placeholder:"Ask about your finances...",onKeyDown:e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(input);}},style:{...S.inp,resize:"none",flex:1}}),
        h("button",{onClick:()=>send(input),disabled:loading,style:{...S.btn(),opacity:loading?.5:1,padding:"8px 12px",alignSelf:"stretch"}},"Send")
      )
    )
  );
}

function UploadTab({apiKey,cats,onConfirm}){
  const[status,setStatus]=useState(null);const[preview,setPreview]=useState(null);const[err,setErr]=useState("");
  async function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    if(!apiKey){setStatus("error");setErr("Save your API key in the AI Advisor panel first.");return;}
    setStatus("loading");setPreview(null);
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const catList=cats.map(c=>c.id+"="+c.label).join(", ");
      const prompt="Analyze this Nigerian bank statement. Extract EVERY transaction. Return ONLY valid JSON: {month: Jun-Jul 2026, transactions:[{desc, amount, date, cat, source}]} Categories: "+catList;
      const isPdf=file.type==="application/pdf";
      const content=[isPdf?{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}}:{type:"image",source:{type:"base64",media_type:file.type,data:b64}},{type:"text",text:prompt}];
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:4000,messages:[{role:"user",content}]})});
      const j=await res.json();if(j.error)throw new Error(j.error.message);
      const text=(j.content||[]).map(i=>i.text||"").join("");
      const cleaned=text.split("```json").join("").split("```").join("").trim();const parsed=JSON.parse(cleaned);
      setPreview({month:parsed.month,txns:parsed.transactions.map(t=>({...t,id:uid(),month:parsed.month,amount:Number(t.amount)||0}))});
      setStatus("done");
    }catch(ex){setStatus("error");setErr(ex.message);}
    e.target.value="";
  }
  const income=preview?preview.txns.filter(t=>t.cat==="income").reduce((s,t)=>s+t.amount,0):0;
  const expenses=preview?preview.txns.filter(t=>t.cat!=="income").reduce((s,t)=>s+t.amount,0):0;
  return h("div",null,
    h("div",{style:{...S.card(),textAlign:"center",border:"2px dashed #4f46e5"}},
      h("div",{style:{fontSize:14,fontWeight:700,color:"#fff",marginBottom:4}},"Upload Bank Statement"),
      h("div",{style:{fontSize:11,color:"#64748b",marginBottom:14}},"Stanbic - OPay - GTBank - PDF or image"),
      h("label",{style:{display:"inline-block",padding:"9px 22px",background:"#6366f1",borderRadius:9,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}},
        status==="loading"?"Analysing...":"Choose File",
        h("input",{type:"file",accept:".pdf,image/*",onChange:handleFile,style:{display:"none"},disabled:status==="loading"})
      )
    ),
    status==="loading"&&h("div",{style:{textAlign:"center",padding:20,color:"#a5b4fc"}},"Reading statement... 20 to 40 seconds"),
    status==="error"&&h("div",{style:{background:"#1a0808",border:"1px solid #ef4444",borderRadius:10,padding:12,color:"#fca5a5",fontSize:12,marginBottom:12}},err),
    status==="done"&&preview&&h("div",{style:{...S.card(),border:"1px solid #10b981"}},
      h("div",{style:{fontSize:13,fontWeight:700,color:"#34d399",marginBottom:12}},preview.month+" - "+preview.txns.length+" transactions found"),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}},
        h("div",{style:{background:"#0d0d20",borderRadius:10,padding:11}},h("div",{style:{fontSize:10,color:"#64748b"}},"INCOME"),h("div",{style:{fontSize:15,fontWeight:800,color:"#10b981"}},fmt(income))),
        h("div",{style:{background:"#0d0d20",borderRadius:10,padding:11}},h("div",{style:{fontSize:10,color:"#64748b"}},"EXPENSES"),h("div",{style:{fontSize:15,fontWeight:800,color:"#ef4444"}},fmt(expenses)))
      ),
      h("button",{onClick:()=>onConfirm(preview.txns),style:{...S.btn(),width:"100%",padding:11,fontSize:13}},"Add "+preview.txns.length+" Transactions")
    )
  );
}


// INVESTMENTS TAB
function InvestmentsTab(props){
  var investments=props.investments||[];
  var savingsGoals=props.savingsGoals||[];
  var invTypes=props.invTypes||INV_TYPES;
  var onUpdateInv=props.onUpdateInv;
  var onUpdateGoals=props.onUpdateGoals;
  var onUpdateTypes=props.onUpdateTypes;

  const[showAdd,setShowAdd]=useState(false);
  const[showGoal,setShowGoal]=useState(false);
  const[showPay,setShowPay]=useState(null);
  const[inv,setInv]=useState({type:"tbills",name:"",principal:"",annualRate:"",startDate:"",maturityDate:"",notes:"",month:"May-Jun 2026"});
  const[goal,setGoal]=useState({name:"",target:"",deadline:""});
  const[payAmt,setPayAmt]=useState("");
  const[payDate,setPayDate]=useState("");
  const[payNote,setPayNote]=useState("");

function BackupTab({state,uploadHistory,onRestore}){
  const[msg,setMsg]=useState("");
  const lastBackup=localStorage.getItem("ftrack_last_backup");
  const daysSince=lastBackup?Math.floor((new Date()-new Date(lastBackup))/86400000):999;
  function doBackup(){
    const blob=new Blob([JSON.stringify({...state,_date:new Date().toISOString()},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="finance-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
    localStorage.setItem("ftrack_last_backup",new Date().toISOString().slice(0,10));
    setMsg("Backup downloaded! Save to Google Drive or email yourself.");
  }
  function doRestore(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.transactions)throw new Error("Invalid file");
        if(!confirm("Restore? This replaces all current data."))return;
        const{_date,...rest}=data;
        Object.keys(rest).forEach(k=>{if(k!=="ftrack_pw")localStorage.setItem(k==="state"?KEY:KEY,JSON.stringify(rest));});
        localStorage.setItem(KEY,JSON.stringify(rest));
        setMsg("Restored! Reloading...");
        setTimeout(()=>window.location.reload(),1000);
      }catch(err){setMsg("Invalid backup file.");}
    };
    r.readAsText(file);e.target.value="";
  }
  return h("div",null,

      ...uploadHistory.map(h2=>h("div",{key:h2.id,style:{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid #1a1a38",fontSize:11}},
        h("span",{style:{color:"#94a3b8"}},h2.month+" - "+h2.date),
        h("span",{style:{color:"#10b981",fontWeight:700}},h2.count+" transactions")
      ))

}

function App(){
  const[state,setState]=useState(()=>loadState());
  const[unlocked,setUnlocked]=useState(()=>sessionStorage.getItem("ftrack_ok")==="1");
  const[tab,setTab]=useState("dashboard");
  const[drill,setDrill]=useState(null);
  const[showMan,setShowMan]=useState(false);
  const[showCats,setShowCats]=useState(false);
  const[showBudget,setShowBudget]=useState(false);

  const{transactions:txns,categories:cats,budgets,apiKey,investments,savingsGoals,openingBalances,uploadHistory}=state;
  const allCats=cats||CATS;
  const allInvTypes=invTypes||INV_TYPES;
  const months=sortMonths([...new Set(txns.map(t=>t.month))]);
  const latestMonth=months.length>0?months[months.length-1]:"May-Jun 2026";
  const[month,setMonth]=useState(latestMonth);

  const ob=(openingBalances||{})[month]||0;
  const{income:rawIncome,byCat,expenses}=calcMonth(txns,month);
  const income=rawIncome+ob;
  const net=income-expenses;
  const expCats=allCats.filter(c=>c.type==="expense");
  const catMap=Object.fromEntries(allCats.map(c=>[c.id,c]));
  const allIncome=txns.filter(t=>t.cat==="income").reduce((s,t)=>s+t.amount,0);
  const allExp=txns.filter(t=>t.cat!=="income").reduce((s,t)=>s+t.amount,0);
  const top3=txns.filter(t=>t.month===month&&t.cat!=="income").sort((a,b)=>b.amount-a.amount).slice(0,3);
  const prevIdx=months.indexOf(month)-1;
  const prevData=prevIdx>=0?calcMonth(txns,months[prevIdx]):null;
  const[man,setMan]=useState({cat:"food_dining",desc:"",amount:"",date:"",notes:"",month:latestMonth,source:"Manual"});

  function persist(u){const n={...state,...u};setState(n);saveState(n);}
  function reclassify(id,nc){persist({transactions:txns.map(t=>t.id===id?{...t,cat:nc}:t)});}
  function deleteTxn(id){persist({transactions:txns.filter(t=>t.id!==id)});}
  function saveApiKey(k){persist({apiKey:k.trim()});}

  function addManual(){
    const amt=parseFloat(man.amount);if(!man.desc.trim()||!amt)return;
    persist({transactions:[...txns,{...man,id:uid(),amount:amt}]});
    setMan(m=>({...m,desc:"",amount:"",date:"",notes:""}));
    setShowMan(false);setMonth(man.month);
  }

  function confirmUpload(newTxns){
    const dupes=newTxns.filter(nt=>txns.some(ex=>ex.month===nt.month&&Math.abs(ex.amount-nt.amount)<0.01&&ex.desc.toLowerCase()===nt.desc.toLowerCase()));
    if(dupes.length>0&&!confirm("Found "+dupes.length+" possible duplicates. Add anyway?"))
      newTxns=newTxns.filter(nt=>!txns.some(ex=>ex.month===nt.month&&Math.abs(ex.amount-nt.amount)<0.01&&ex.desc.toLowerCase()===nt.desc.toLowerCase()));
    const hist={id:uid(),date:new Date().toLocaleDateString("en-NG"),time:new Date().toLocaleTimeString("en-NG",{hour:"2-digit",minute:"2-digit"}),month:newTxns[0]&&newTxns[0].month||"",count:newTxns.length,dupes:dupes.length};
    persist({transactions:[...txns,...newTxns],uploadHistory:[hist,...(uploadHistory||[])].slice(0,50)});
    if(newTxns.length)setMonth(newTxns[0].month);
    setTab("dashboard");
  }

  function carryForward(){
    if(net<=0){alert("No positive balance to carry forward.");return;}
    const nextIdx=months.indexOf(month)+1;
    const FUTURE=["Jun-Jul 2026","Jul-Aug 2026","Aug-Sep 2026","Oct-Nov 2026","Nov-Dec 2026","Dec-Jan 2027"];
    const hasNext=(nextIdx - months.length < 0);const nextMonth=hasNext?months[nextIdx]:FUTURE_MONTHS[0];
    if(confirm("Carry "+fmt(net)+" to "+nextMonth+" as opening balance?")){
      persist({openingBalances:{...(openingBalances||{}),[nextMonth]:net}});
      alert("Done! "+fmt(net)+" set as opening balance for "+nextMonth);
    }
  }

  function exportCSV(){
    var header="Date,Month,Description,Category,Amount,Source";
    var rowLines=txns.filter(function(t){return t.month===month;}).map(function(t){
      var cat=catMap[t.cat]&&catMap[t.cat].label||t.cat;
      var desc=(t.desc||"").replace(/"/g,"");
      return [t.date,t.month,desc,cat,t.amount.toFixed(2),t.source].join(",");
    });
    var csv=[header].concat(rowLines).join("\n");
    var blob=new Blob([csv],{type:"text/csv"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="finance-"+month.replace(/ /g,"_")+".csv";
    a.click();
  }

  function updateCats(newCats){
    const ids=new Set(newCats.map(c=>c.id));
    persist({categories:newCats,transactions:txns.map(t=>ids.has(t.cat)?t:{...t,cat:"other"})});
    setShowCats(false);
  }

  if(!unlocked)return h(PasswordLock,{onUnlock:()=>{sessionStorage.setItem("ftrack_ok","1");setUnlocked(true);}});

  const TABS=[{id:"dashboard",label:"Dashboard"},{id:"investments",label:"Investments"},{id:"annual",label:"Annual"},{id:"upload",label:"Upload"},{id:"backup",label:"Backup"}];

      h("div",{onClick:e=>e.stopPropagation(),style:{background:"#111126",borderRadius:16,padding:24,width:"100%",maxWidth:540,border:"1px solid #252540",maxHeight:"90vh",overflowY:"auto"}},

            h("span",{style:{fontSize:9,color:"#64748b",background:"#1a1a38",padding:"2px 6px",borderRadius:4}},cat.type)

        h("div",{style:{marginTop:16,padding:14,background:"#0d0d20",borderRadius:10,border:"1px solid #252540"}},
          h("div",{style:{fontSize:11,fontWeight:700,color:"#a5b4fc",marginBottom:10}},"Add New Category"),
          h("div",{id:"newCatForm",style:{display:"flex",gap:8,alignItems:"center"}},
            h("input",{id:"newCatLabel",placeholder:"Category name",style:S.inp}),

              updateCats(newCats);

    ),

    // BUDGET MODAL
    showBudget&&h("div",{onClick:()=>setShowBudget(false),style:{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
      h("div",{onClick:e=>e.stopPropagation(),style:{background:"#111126",borderRadius:16,padding:24,width:"100%",maxWidth:500,border:"1px solid #252540",maxHeight:"90vh",overflowY:"auto"}},

              h("span",{style:{fontSize:10,color:"#475569"}},"Click to drill down and reclassify")
            ),
            expCats.filter(c=>byCat[c.id]).length===0
            ?h("div",{style:{textAlign:"center",color:"#475569",padding:20}},"No expense data. Upload a statement or add entries manually.")
            :[...expCats].sort((a,b)=>(byCat[b.id]||0)-(byCat[a.id]||0)).map(cat=>{
              const amt=byCat[cat.id]||0;if(!amt)return null;
              const pct=expenses>0?(amt/expenses*100):0;
              const count=txns.filter(t=>t.month===month&&t.cat===cat.id).length;
              const budget=(budgets||{})[cat.id]||0;
              const over=budget>0&&amt>budget;
              const diffPct=budget>0?Math.abs(((amt-budget)/budget)*100).toFixed(0):0;
              return h("div",{key:cat.id,onClick:()=>setDrill(cat.id),style:{marginBottom:10,padding:"7px 9px",borderRadius:9,cursor:"pointer"},onMouseOver:e=>e.currentTarget.style.background="#0d0d20",onMouseOut:e=>e.currentTarget.style.background="transparent"},
                h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}},
                  h("div",{style:{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}},
                    h("span",{style:{fontSize:12,color:"#cbd5e1"}},cat.label),
                    h("span",{style:S.tag(cat.color)},count+" items"),
                    over&&h("span",{style:S.tag("#ef4444")},diffPct+"% over budget")
                  ),
                  h("div",{style:{display:"flex",gap:10,alignItems:"center"}},
                    h("span",{style:{fontSize:10,color:"#64748b"}},pct.toFixed(1)+"%"),
                    h("span",{style:{fontSize:12,fontWeight:700,color:over?"#ef4444":cat.color}},fmt(amt))
                  )
                ),
                h("div",{style:{background:"#0a0a18",borderRadius:20,height:5}},h("div",{style:{height:"100%",borderRadius:20,width:pct+"%",background:cat.color}})),
                budget>0&&h("div",{style:{fontSize:10,marginTop:3,color:over?"#ef4444":"#10b981",fontWeight:600}},
                  over?diffPct+"% over budget ("+fmt(amt-budget)+" over "+fmt(budget)+")":
                  diffPct+"% under budget ("+fmt(budget-amt)+" remaining)"
                )
              );
            })
          )
        ),

        // TRENDS
        tab==="trends"&&h("div",null,
          h("div",{style:S.card()},
            h("div",{style:{fontSize:12,fontWeight:700,color:"#a5b4fc",marginBottom:14}},"Monthly Trend"),
            h("div",{style:{overflowX:"auto"}},
              h("div",{style:{display:"flex",gap:4,alignItems:"flex-end",minWidth:months.length*80,height:180,padding:"0 8px"}},
                ...months.map((mk)=>{
                  const mc=calcMonth(txns,mk);const mnet=mc.income-mc.expenses;
                  const maxV=Math.max(1,...months.map(m=>{const d=calcMonth(txns,m);return Math.max(d.income,d.expenses);}));
                  return h("div",{key:mk,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:70}},
                    h("div",{style:{fontSize:9,color:mnet>=0?"#10b981":"#ef4444",fontWeight:700}},(mnet>=0?"+":"")+fmt(mnet)),
                    h("div",{style:{display:"flex",gap:3,alignItems:"flex-end",height:140}},
                      h("div",{style:{width:16,height:Math.max(4,(mc.income/maxV)*140)+"px",background:"#10b981",borderRadius:"4px 4px 0 0"}}),
                      h("div",{style:{width:16,height:Math.max(4,(mc.expenses/maxV)*140)+"px",background:"#ef4444",borderRadius:"4px 4px 0 0"}})
                    ),
                    h("div",{style:{fontSize:8,color:"#64748b",marginTop:4,textAlign:"center",whiteSpace:"nowrap"}},mk)
                  );
                })
              )
            )
          ),
          ...sortMonths(months).map(mk=>{
            const mc=calcMonth(txns,mk);const mnet=mc.income-mc.expenses;
            return h("div",{key:mk,style:S.card()},
              h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:8}},h("span",{style:{fontWeight:700,color:"#e2e8f0"}},mk),h("span",{style:{fontWeight:700,color:mnet>=0?"#10b981":"#ef4444"}},"Net: "+fmt(mnet))),
              h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
                [{label:"INCOME",val:mc.income,color:"#10b981"},{label:"EXPENSES",val:mc.expenses,color:"#ef4444"}].map(x=>h("div",{key:x.label},h("div",{style:{fontSize:9,color:"#64748b",marginBottom:3}},x.label),h("div",{style:{background:"#0d0d20",borderRadius:7,height:22,overflow:"hidden",display:"flex",alignItems:"center",paddingLeft:8}},h("span",{style:{fontSize:11,fontWeight:700,color:x.color}},fmt(x.val)))))
              )
            );
          })
        ),

        tab==="investments"&&h(InvestmentsTab,{investments:investments||[],savingsGoals:savingsGoals||[],invTypes:allInvTypes,onUpdateInv:inv=>persist({investments:inv}),onUpdateGoals:g=>persist({savingsGoals:g}),onUpdateTypes:t=>persist({invTypes:t})}),
        tab==="annual"&&h(AnnualTab,{txns,cats:allCats}),
        tab==="upload"&&h(UploadTab,{apiKey,cats:allCats,onConfirm:confirmUpload}),
        tab==="backup"&&h(BackupTab,{state,uploadHistory:uploadHistory||[],onRestore:data=>{const{_date,...rest}=data;persist(rest);}})
      ),

      // AI SIDEBAR
      h("div",{style:{width:300,flexShrink:0,overflow:"hidden",display:"flex",flexDirection:"column"}},
        h(AiChat,{txns,cats:allCats,apiKey,onSaveKey:saveApiKey})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
