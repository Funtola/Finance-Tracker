const FUTURE_MONTHS=["Jun-Jul 2026","Jul-Aug 2026","Aug-Sep 2026","Sep-Oct 2026","Oct-Nov 2026","Nov-Dec 2026","Dec-Jan 2027","Jan-Feb 2027","Feb-Mar 2027","Mar-Apr 2027"];

const KEY="ftrack_v5";

function loadState(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const p=JSON.parse(r);
      if(!p.categories)p.categories=CATS;
      if(!p.budgets)p.budgets={};
      if(!p.apiKey)p.apiKey="";
      if(!p.investments)p.investments=[];
      if(!p.savingsGoals)p.savingsGoals=[];
      if(!p.openingBalances)p.openingBalances={};
      if(!p.uploadHistory)p.uploadHistory=[];
      if(!p.invTypes)p.invTypes=[];
      if(!p.debts)p.debts=[];
      return p;
    }
  }catch(e){console.error("Load error",e);}
  return{transactions:[],categories:CATS,budgets:{},apiKey:"",investments:[],savingsGoals:[],openingBalances:{},uploadHistory:[],invTypes:[],debts:[]};
}

function patchState(state){
  // Clear all Jun-Jul 2026 transactions so user can upload fresh
  if(state.patchV==="v6"){return state;}
  // Remove all existing Jun-Jul 2026 data
  state.transactions=state.transactions.filter(function(t){
    return t.month!=="Jun-Jul 2026"&&t.month!=="Jul 2026"&&t.month!=="July 2026";
  });
  // Add education category if missing
  if(!state.categories){state.categories=CATS;}
  var hasEdu=state.categories.some(function(c){return c.id==="education";});
  if(!hasEdu){
    state.categories=state.categories.concat([{id:"education",label:"Education",color:"#3b82f6",type:"expense"}]);
  }
  state.patchV="v6";
  saveState(state);
  return state;
}

function saveState(s){
  try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){console.error("Save error",e);}
}

const fmt=n=>"N"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>"u"+Date.now()+Math.random().toString(36).slice(2,6);

function sortMonths(ms){
  const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return[...ms].sort((a,b)=>{
    const pa=a.split(" "),pb=b.split(" ");
    const ya=parseInt(pa[pa.length-1]||"2026"),yb=parseInt(pb[pb.length-1]||"2026");
    const ma=MN.indexOf(pa[0].split("-")[0]),mb=MN.indexOf(pb[0].split("-")[0]);
    return ya!==yb?ya-yb:ma-mb;
  });
}

function calcMonth(txns,month){
  const rows=txns.filter(t=>t.month===month);
  const income=rows.filter(t=>t.cat==="income").reduce((s,t)=>s+t.amount,0);
  const byCat={};
  rows.filter(t=>t.cat!=="income").forEach(t=>{byCat[t.cat]=(byCat[t.cat]||0)+t.amount;});
  return{income,byCat,expenses:Object.values(byCat).reduce((s,v)=>s+v,0)};
}

function PasswordLock({onUnlock}){
  const[pw,setPw]=useState("");const[err,setErr]=useState("");
  const[setup,setSetup]=useState(!localStorage.getItem("ftrack_pw"));
  const[np,setNp]=useState("");const[cp,setCp]=useState("");
  function tryUnlock(){if(pw===localStorage.getItem("ftrack_pw"))onUnlock();else{setErr("Wrong password.");setPw("");}}
  function createPw(){if(np.length<4){setErr("Min 4 chars.");return;}if(np!==cp){setErr("Passwords dont match.");return;}localStorage.setItem("ftrack_pw",np);onUnlock();}
  const box={minHeight:"100vh",background:"#080814",display:"flex",alignItems:"center",justifyContent:"center"};
  const inner={background:"#111126",borderRadius:20,padding:36,width:340,border:"1px solid #252540",textAlign:"center"};
  if(setup)return h("div",{style:box},h("div",{style:inner},
    h("div",{style:{fontSize:32,marginBottom:10}},"[lock]"),
    h("div",{style:{fontSize:16,fontWeight:800,color:"#fff",marginBottom:4}},"Create Password"),
    h("div",{style:{fontSize:11,color:"#64748b",marginBottom:20}},"Protects your finance tracker"),
    h("input",{type:"password",value:np,onChange:e=>{setNp(e.target.value);setErr("");},placeholder:"Create password (min 4)",style:{...S.inp,marginBottom:8,textAlign:"center"},onKeyDown:e=>e.key==="Enter"&&createPw()}),
    h("input",{type:"password",value:cp,onChange:e=>{setCp(e.target.value);setErr("");},placeholder:"Confirm password",style:{...S.inp,marginBottom:14,textAlign:"center"},onKeyDown:e=>e.key==="Enter"&&createPw()}),
    err&&h("div",{style:{fontSize:11,color:"#ef4444",marginBottom:10}},err),
    h("button",{onClick:createPw,style:{...S.btn(),width:"100%",padding:12}},"Set Password and Enter")
  ));
  return h("div",{style:box},h("div",{style:inner},
    h("div",{style:{fontSize:32,marginBottom:8}},"[money]"),
    h("div",{style:{fontSize:9,letterSpacing:3,color:"#6366f1",fontWeight:700,textTransform:"uppercase",marginBottom:4}},"Oluwafunto Personal Finance"),
    h("div",{style:{fontSize:16,fontWeight:800,color:"#fff",marginBottom:4}},"Expense Tracker"),
    h("div",{style:{fontSize:11,color:"#64748b",marginBottom:20}},"Cycle: 25th to 25th"),
    h("input",{type:"password",value:pw,onChange:e=>{setPw(e.target.value);setErr("");},placeholder:"Enter password",autoFocus:true,style:{...S.inp,marginBottom:12,textAlign:"center",fontSize:15,letterSpacing:4},onKeyDown:e=>e.key==="Enter"&&tryUnlock()}),
    err&&h("div",{style:{fontSize:11,color:"#ef4444",marginBottom:10}},err),
    h("button",{onClick:tryUnlock,style:{...S.btn(),width:"100%",padding:12}},"Unlock")
  ));
}

  const[reclTxn,setReclTxn]=useState(null);

function AiChat({txns,cats,apiKey,onSaveKey}){
  const[msgs,setMsgs]=useState([{role:"ai",text:"Hi Oluwafunto! Ask me anything about your finances."}]);
  const[input,setInput]=useState("");const[loading,setLoading]=useState(false);
  const[history,setHistory]=useState([]);const[localKey,setLocalKey]=useState(apiKey||"");
  const bottomRef=useRef();
  function buildCtx(){
    const months=sortMonths([...new Set(txns.map(t=>t.month))]);
    return months.map(mk=>{
      const{income,byCat,expenses}=calcMonth(txns,mk);const net=income-expenses;
      var header="== "+mk+" == Income:"+fmt(income)+" Expenses:"+fmt(expenses)+" Net:"+fmt(net);
      var catLines=[];
      cats.filter(function(c){return c.type==="expense";}).forEach(function(c){if(byCat[c.id])catLines.push(c.label+": "+fmt(byCat[c.id]));});
      return header+"\n"+catLines.join("\n");
    }).join("\n");
  }
  async function send(q){
    if(!q.trim())return;
    const key=localKey||apiKey;
    if(!key){setMsgs(m=>[...m,{role:"ai",text:"Please enter your API key above."}]);return;}
    setInput("");setLoading(true);
    const newH=[...history,{role:"user",content:q}];
    setMsgs(m=>[...m,{role:"user",text:q},{role:"ai",text:"Thinking..."}]);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:900,
          system:"You are a personal finance advisor for Oluwafunto in Lagos Nigeria. Be honest and specific. Use NGN. DATA:"+buildCtx(),
          messages:newH})});
      const j=await res.json();
      if(j.error)throw new Error(j.error.message);
      const reply=(j.content||[]).map(i=>i.text||"").join("")||"No response.";
      setHistory([...newH,{role:"assistant",content:reply}]);
      setMsgs(m=>[...m.slice(0,-1),{role:"ai",text:reply}]);
    }catch(err){setMsgs(m=>[...m.slice(0,-1),{role:"ai",text:"Error: "+err.message}]);}
    setLoading(false);
    setTimeout(()=>bottomRef.current&&bottomRef.current.scrollIntoView({behavior:"smooth"}),100);
  }
  const QUICK=["Where am I overspending?","Build me a budget","Savings analysis","Top 3 to cut"];
  return h("div",{style:{display:"flex",flexDirection:"column",height:"100%",background:"#0b0b1e",borderLeft:"1px solid #1e1e38"}},
    h("div",{style:{padding:"12px 14px",borderBottom:"1px solid #1e1e38",background:"#111126",flexShrink:0}},
      h("div",{style:{fontSize:12,fontWeight:800,color:"#a5b4fc"}},"AI Finance Advisor"),
      h("div",{style:{fontSize:10,color:"#475569"}},"Powered by Claude"),
      !apiKey&&h("div",{style:{display:"flex",gap:6,marginTop:8}},
        h("input",{type:"password",placeholder:"Paste API key sk-ant",value:localKey,onChange:e=>setLocalKey(e.target.value),style:{...S.inp,fontSize:10,flex:1}}),
        h("button",{onClick:()=>onSaveKey(localKey),style:{...S.btn(),padding:"6px 10px",fontSize:11}},"Save")
      ),
      apiKey&&h("div",{style:{fontSize:10,color:"#10b981",marginTop:4}},"API key active")
    ),
    h("div",{style:{flex:1,overflowY:"auto",padding:"12px 14px",display:"flex",flexDirection:"column",gap:8}},
      ...msgs.map((m,i)=>h("div",{key:i,style:{maxWidth:"92%",alignSelf:m.role==="user"?"flex-end":"flex-start",padding:"9px 12px",borderRadius:12,fontSize:12,lineHeight:1.65,background:m.role==="user"?"#6366f1":"#1a1a38",color:m.role==="user"?"#fff":"#e2e8f0",whiteSpace:"pre-wrap",wordBreak:"break-word"}},m.text)),
      h("div",{ref:bottomRef})
    ),
    h("div",{style:{padding:"10px 12px",borderTop:"1px solid #1e1e38",flexShrink:0}},
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}},
        ...QUICK.map(q=>h("span",{key:q,onClick:()=>send(q),style:{fontSize:10,padding:"3px 9px",background:"#1a1a38",border:"1px solid #252540",borderRadius:10,color:"#94a3b8",cursor:"pointer"}},q))
      ),
      h("div",{style:{display:"flex",gap:6}},
        h("textarea",{value:input,onChange:e=>setInput(e.target.value),rows:2,placeholder:"Ask about your finances...",onKeyDown:e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(input);}},style:{...S.inp,resize:"none",flex:1}}),
        h("button",{onClick:()=>send(input),disabled:loading,style:{...S.btn(),opacity:loading?.5:1,padding:"8px 12px",alignSelf:"stretch"}},"Send")
      )
    )
  );
}

function UploadTab({apiKey,cats,onConfirm}){
  const[status,setStatus]=useState(null);const[preview,setPreview]=useState(null);const[err,setErr]=useState("");
  async function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    if(!apiKey){setStatus("error");setErr("Save your API key in the AI Advisor panel first.");return;}
    
    // Handle Excel/CSV files
    const isExcel=file.name.endsWith(".xlsx")||file.name.endsWith(".xls");
    const isCsv=file.name.endsWith(".csv")||file.type==="text/csv";
    
    if(isExcel||isCsv){
      setStatus("loading");setPreview(null);setErr("");
      try{
        var rawText;
        if(isExcel){
          // .xlsx/.xls are binary zip files - must be parsed with SheetJS, not read as text
          var buf=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(ev){res(ev.target.result);};r.onerror=rej;r.readAsArrayBuffer(file);});
          var wb=XLSX.read(buf,{type:"array"});
          var firstSheetName=wb.SheetNames[0];
          var sheet=wb.Sheets[firstSheetName];
          rawText=XLSX.utils.sheet_to_csv(sheet);
        }else{
          rawText=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(ev){res(ev.target.result);};r.onerror=rej;r.readAsText(file);});
        }
        var catList=cats.map(function(c){return c.id+"="+c.label;}).join(", ");
        var sysMsg="You are a JSON API. You ONLY output raw JSON. Never write sentences. Never explain. Output nothing except the JSON object.";
        var userMsg="Parse this Nigerian bank statement CSV and return a JSON object. Output ONLY the JSON, nothing else, no explanation.\n\nFormat: {\"month\":\"Jun-Jul 2026\",\"transactions\":[{\"desc\":\"short description\",\"amount\":5000,\"date\":\"27 Jun\",\"cat\":\"food_dining\",\"source\":\"OPay\"}]}\n\nCategory IDs: "+catList+"\n\nRules:\n- Debit/withdrawal = expense\n- Credit/deposit from others = income\n- income: salary, received transfers\n- transportation: uber, tfare, bolt\n- food_dining: food, restaurants, groceries, supermarket\n- clothing_beauty: clothes, hair, nails\n- giving: donations, charity, gifts to family\n- utilities: electricity, NEPA, gas\n- data_airtime: MTN, Airtel, data, airtime\n- health: hospital, clinic, pharmacy\n- car_auto: fuel, car parts, driving school\n- bank_charges: SMS fee, ATM fee, card fee\n- education: school fees, courses\n- savings: fixed deposit, investment\n- loans_transfers: money sent as loans\n\nData:\n"+rawText.slice(0,100000);

function BackupTab({state,uploadHistory,onRestore}){
  const[msg,setMsg]=useState("");
  const lastBackup=localStorage.getItem("ftrack_last_backup");
  const daysSince=lastBackup?Math.floor((new Date()-new Date(lastBackup))/86400000):999;
  function doBackup(){
    const blob=new Blob([JSON.stringify({...state,_date:new Date().toISOString()},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="finance-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
    localStorage.setItem("ftrack_last_backup",new Date().toISOString().slice(0,10));
    setMsg("Backup downloaded! Save to Google Drive or email yourself.");
  }
  function doRestore(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.transactions)throw new Error("Invalid file");
        if(!confirm("Restore? This replaces all current data."))return;
        const{_date,...rest}=data;
        Object.keys(rest).forEach(k=>{if(k!=="ftrack_pw")localStorage.setItem(k==="state"?KEY:KEY,JSON.stringify(rest));});
        localStorage.setItem(KEY,JSON.stringify(rest));
        setMsg("Restored! Reloading...");
        setTimeout(()=>window.location.reload(),1000);
      }catch(err){setMsg("Invalid backup file.");}
    };
    r.readAsText(file);e.target.value="";
  }
  return h("div",null,
    daysSince>30&&h("div",{style:{background:"#1a1200",border:"1px solid #f59e0b40",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:11,color:"#fbbf24"}},
      daysSince===999?"You have not backed up yet! Do it now.":"Last backup "+daysSince+" days ago. Back up now."),
    h("div",{style:S.card()},
      h("div",{style:{fontSize:13,fontWeight:700,color:"#a5b4fc",marginBottom:4}},"Backup Your Data"),
      h("div",{style:{fontSize:11,color:"#64748b",marginBottom:14}},"Downloads all your data as a JSON file. Save to Google Drive or email yourself. Do this every month."),
      h("button",{onClick:doBackup,style:S.btn()},"Download Backup"),
      lastBackup&&h("div",{style:{fontSize:10,color:"#475569",marginTop:8}},"Last backup: "+lastBackup)
    ),
    h("div",{style:S.card()},
      h("div",{style:{fontSize:13,fontWeight:700,color:"#a5b4fc",marginBottom:4}},"Restore From Backup"),
      h("div",{style:{fontSize:11,color:"#64748b",marginBottom:14}},"Upload a backup file to restore all your data. Use when switching devices."),
      h("label",{style:{display:"inline-block",padding:"8px 18px",background:"#1e1e3a",border:"1px solid #252540",borderRadius:8,color:"#94a3b8",fontWeight:700,fontSize:12,cursor:"pointer"}},
        "Choose Backup File",h("input",{type:"file",accept:".json",onChange:doRestore,style:{display:"none"}})
      )
    ),
    msg&&h("div",{style:{padding:"10px 14px",borderRadius:8,marginTop:12,fontSize:12,color:"#10b981",background:"#0a1a0a",border:"1px solid #10b98140"}},msg),
    uploadHistory.length>0&&h("div",{style:S.card()},
      h("div",{style:{fontSize:12,fontWeight:700,color:"#a5b4fc",marginBottom:10}},"Upload History"),
      ...uploadHistory.map(h2=>h("div",{key:h2.id,style:{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid #1a1a38",fontSize:11}},
        h("span",{style:{color:"#94a3b8"}},h2.month+" - "+h2.date),
        h("span",{style:{color:"#10b981",fontWeight:700}},h2.count+" transactions")
      ))
    )
  );
}

  const mc=calcMonth(txns,month);
  const income=mc.income+ob;
  const byCat=mc.byCat;
  const expenses=mc.expenses;
  const net=income-expenses;
  const expCats=allCats.filter(function(c){return c.type==="expense";});
  const catMap=Object.fromEntries(allCats.map(function(c){return[c.id,c];}));
  const allIncome=txns.filter(function(t){return t.cat==="income";}).reduce(function(s,t){return s+t.amount;},0)+ob;
  const allExpenses=txns.filter(function(t){return t.cat!=="income";}).reduce(function(s,t){return s+t.amount;},0);
  const top3=txns.filter(function(t){return t.month===month&&t.cat!=="income";}).sort(function(a,b){return b.amount-a.amount;}).slice(0,3);
  const prevIdx=months.indexOf(month)-1;
  const prevData=prevIdx>=0?calcMonth(txns,months[prevIdx]):null;

  function persist(u){var n=Object.assign({},state,u);setState(n);saveState(n);}
  function reclassify(id,nc,amt,desc,date){persist({transactions:txns.map(function(t){return t.id===id?Object.assign({},t,{cat:nc,amount:amt||t.amount,desc:desc||t.desc,date:date||t.date}):t;})});}
  function deleteTxn(id){persist({transactions:txns.filter(function(t){return t.id!==id;})});}
  function saveApiKey(k){persist({apiKey:k.trim()});}
  function updateCats(newCats){
    var ids=new Set(newCats.map(function(c){return c.id;}));
    persist({categories:newCats,transactions:txns.map(function(t){return ids.has(t.cat)?t:Object.assign({},t,{cat:"other"});})});
    setShowCats(false);
  }
  function updateBudgets(b){persist({budgets:b});setShowBudget(false);}
  function addManual(){
    var amt=parseFloat(man.amount);
    if(!man.desc.trim()||!amt||amt<=0)return;
    persist({transactions:[...txns,Object.assign({},man,{id:uid(),amount:amt})]});
    setMan(function(m){return Object.assign({},m,{desc:"",amount:"",date:"",notes:"",month:latestMonth});});
    setShowMan(false);
    setMonth(man.month);
  }
  function confirmUpload(newTxns){
    var dupes=newTxns.filter(function(nt){return txns.some(function(ex){return ex.month===nt.month&&Math.abs(ex.amount-nt.amount)<0.01&&ex.desc.toLowerCase().trim()===nt.desc.toLowerCase().trim();});});
    if(dupes.length>0&&!confirm("Found "+dupes.length+" possible duplicates. Add anyway?"))
      newTxns=newTxns.filter(function(nt){return !txns.some(function(ex){return ex.month===nt.month&&Math.abs(ex.amount-nt.amount)<0.01&&ex.desc.toLowerCase().trim()===nt.desc.toLowerCase().trim();});});
    var hist={id:uid(),date:new Date().toLocaleDateString("en-NG"),time:new Date().toLocaleTimeString("en-NG",{hour:"2-digit",minute:"2-digit"}),month:newTxns[0]?newTxns[0].month:"Unknown",count:newTxns.length,dupes:dupes.length};
    persist({transactions:[...txns,...newTxns],uploadHistory:[hist,...uploadHistory].slice(0,50)});
    if(newTxns.length)setMonth(newTxns[0].month);
    setTab("dashboard");
  }
  function carryForward(){
    if(net<=0){alert("No positive balance to carry forward.");return;}
    var nextIdx=months.indexOf(month)+1;
    var hasNext=nextIdx<months.length;
    var nextMonth=hasNext?months[nextIdx]:FUTURE_MONTHS[0];
    if(confirm("Carry "+fmt(net)+" to "+nextMonth+" as opening balance?")){
      var newOB=Object.assign({},openingBalances);
      newOB[nextMonth]=net;
      persist({openingBalances:newOB});
      alert("Done! "+fmt(net)+" set as opening balance for "+nextMonth);
    }
  }
  function exportCSV(){
    var header="Date,Month,Description,Category,Amount,Source";
    var rowLines=txns.filter(function(t){return t.month===month;}).map(function(t){
      var cat=catMap[t.cat]?catMap[t.cat].label:t.cat;
      var desc=(t.desc||"").replace(/"/g,"");
      return [t.date,t.month,desc,cat,t.amount.toFixed(2),t.source].join(",");
    });
    var csv=[header].concat(rowLines).join("\n");
    var blob=new Blob([csv],{type:"text/csv"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="finance-"+month.replace(/ /g,"_")+".csv";
    a.click();
  }
  function printReport(){
    var rows=Object.entries(byCat).filter(function(e){return e[1]>0;}).sort(function(a,b){return b[1]-a[1];}).map(function(e){
      var catId=e[0],amt=e[1];
      var cat=catMap[catId]||{label:catId};
      var pct=expenses>0?(amt/expenses*100).toFixed(1):0;
      return "<tr><td style='padding:6px 10px;border-bottom:1px solid #eee'>"+cat.label+"</td><td style='padding:6px 10px;text-align:right;border-bottom:1px solid #eee'>"+fmt(amt)+"</td><td style='padding:6px 10px;text-align:right;border-bottom:1px solid #eee'>"+pct+"%</td></tr>";
    }).join("");
    var w=window.open("","_blank");
    w.document.write("<!DOCTYPE html><html><head><title>Finance Report "+month+"</title><style>body{font-family:Segoe UI,sans-serif;padding:30px;color:#1e293b;max-width:700px;margin:0 auto}h1{color:#6366f1}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}.card{background:#f8fafc;border-radius:10px;padding:14px;border:1px solid #e2e8f0}.label{font-size:10px;color:#94a3b8;font-weight:600;text-transform:uppercase}.value{font-size:20px;font-weight:800;margin-top:4px}table{width:100%;border-collapse:collapse}th{background:#f1f5f9;padding:8px 10px;text-align:left;font-size:11px;color:#64748b;font-weight:600}@media print{button{display:none}}</style></head><body><h1>Finance Report</h1><h3>Oluwafunto - "+month+"</h3><div class='grid'><div class='card'><div class='label'>Income</div><div class='value' style='color:#10b981'>"+fmt(income)+"</div></div><div class='card'><div class='label'>Expenses</div><div class='value' style='color:#ef4444'>"+fmt(expenses)+"</div></div><div class='card'><div class='label'>Net</div><div class='value' style='color:"+(net>=0?"#6366f1":"#ef4444")+"'>"+fmt(net)+"</div></div></div><table><thead><tr><th>Category</th><th style='text-align:right'>Amount</th><th style='text-align:right'>%</th></tr></thead><tbody>"+rows+"</tbody></table><br><button onclick='window.print()' style='padding:10px 20px;background:#6366f1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700'>Print</button></body></html>");
    w.document.close();
  }

  if(!unlocked)return h(PasswordLock,{onUnlock:function(){sessionStorage.setItem("ftrack_ok","1");setUnlocked(true);}});

  var TABS=[{id:"dashboard",label:"Dashboard"},{id:"investments",label:"Investments"},{id:"annual",label:"Annual"},{id:"upload",label:"Upload"},{id:"backup",label:"Backup"}];

  return h("div",{style:{fontFamily:"Segoe UI,sans-serif",background:"#080814",minHeight:"100vh",color:"#e2e8f0",display:"flex",flexDirection:"column"}},
    showCats?h(ManageCategories,{cats:allCats,onUpdate:updateCats,onClose:function(){setShowCats(false);}}):null,
    showBudget?h(BudgetTargets,{cats:allCats,budgets:budgets,month:month,byCat:byCat,onUpdate:updateBudgets,onClose:function(){setShowBudget(false);}}):null,
    h("div",{style:{background:"linear-gradient(135deg,#0f0f28,#161638)",borderBottom:"1px solid #1e1e3a",padding:"11px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,position:"sticky",top:0,zIndex:100,flexWrap:"wrap",gap:8}},
      h("div",null,
        h("div",{style:{fontSize:9,letterSpacing:3,color:"#6366f1",fontWeight:700,textTransform:"uppercase"}},"Oluwafunto Personal Finance - Cycle 25th to 25th"),
        h("div",{style:{fontSize:15,fontWeight:800,color:"#fff",marginTop:1}},"Expense Tracker")
      ),
      h("div",{style:{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}},
        TABS.map(function(t){return h("button",{key:t.id,onClick:function(){setTab(t.id);},style:Object.assign({},S.pill(tab===t.id),{border:"none"})},t.label);}),
        h("div",{style:{width:1,height:18,background:"#252540",margin:"0 2px"}}),
        h("button",{onClick:function(){setShowCats(true);},style:Object.assign({},S.pill(false),{border:"none"})},"Categories"),
        h("button",{onClick:function(){var np=prompt("New password min 4 chars:");if(np&&np.length>=4){var c2=prompt("Confirm:");if(c2===np){localStorage.setItem("ftrack_pw",np);alert("Password updated!");}}},style:Object.assign({},S.pill(false),{border:"none"})},"Password"),
        h("button",{onClick:function(){sessionStorage.removeItem("ftrack_ok");window.location.reload();},style:{padding:"6px 10px",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,background:"#2a0808",color:"#ef4444"}},"Lock"),
        h("button",{onClick:function(){if(confirm("RESET ALL DATA? Cannot be undone!")){localStorage.removeItem(KEY);localStorage.removeItem("ftrack_pw");sessionStorage.removeItem("ftrack_ok");window.location.reload();}},style:{padding:"6px 10px",borderRadius:8,border:"none",cursor:"pointer",fontSize:10,background:"#1a1a38",color:"#475569"}},"Reset")
      )
    ),
    h("div",{style:{display:"flex",flex:1,overflow:"hidden",height:"calc(100vh - 53px)"}},
      h("div",{style:{flex:1,overflowY:"auto",padding:"16px 18px 20px"}},
        tab==="dashboard"?h("div",null,
          drill?h(DrilldownPanel,{catId:drill,month:month,txns:txns,cats:allCats,onReclassify:reclassify,onDelete:deleteTxn,onClose:function(){setDrill(null);}}):null,
          h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:14}},
            h("span",{style:{fontSize:10,color:"#64748b"}},"Month:"),
            months.map(function(mk){return h("button",{key:mk,onClick:function(){setMonth(mk);},style:Object.assign({},S.pill(mk===month),{border:"none"})},mk);}),
            h("div",{style:{marginLeft:"auto",display:"flex",gap:6}},
              h("button",{onClick:function(){setShowBudget(true);},style:Object.assign({},S.pill(false),{border:"none",padding:"5px 10px"})},"Budgets"),
              h("button",{onClick:exportCSV,style:Object.assign({},S.pill(false),{border:"none",padding:"5px 10px"})},"Export"),
              h("button",{onClick:printReport,style:Object.assign({},S.pill(false),{border:"none",padding:"5px 10px"})},"Print"),
              h("button",{onClick:function(){setShowMan(function(v){return !v;});},style:Object.assign({},S.pill(false),{border:"none",padding:"5px 10px"})},"Add Entry")
            )
          ),
          months.length>1?h("div",{style:{background:"#0d0d20",border:"1px solid #252540",borderRadius:10,padding:"10px 14px",marginBottom:10,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}},
            h("div",null,h("div",{style:{fontSize:9,color:"#64748b",fontWeight:600,textTransform:"uppercase",letterSpacing:1}},"All-Time Income"),h("div",{style:{fontSize:14,fontWeight:800,color:"#10b981",marginTop:2}},fmt(allIncome))),
            h("div",null,h("div",{style:{fontSize:9,color:"#64748b",fontWeight:600,textTransform:"uppercase",letterSpacing:1}},"All-Time Expenses"),h("div",{style:{fontSize:14,fontWeight:800,color:"#ef4444",marginTop:2}},fmt(allExpenses))),
            h("div",null,h("div",{style:{fontSize:9,color:"#64748b",fontWeight:600,textTransform:"uppercase",letterSpacing:1}},"All-Time Net"),h("div",{style:{fontSize:14,fontWeight:800,color:allIncome-allExpenses>=0?"#6366f1":"#ef4444",marginTop:2}},fmt(allIncome-allExpenses)))
          ):null,
          showMan?h("div",{style:S.card()},
            h("div",{style:{fontSize:11,fontWeight:700,color:"#a5b4fc",marginBottom:10}},"Add Manual Transaction"),
            h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}},
              h("select",{value:man.cat,onChange:function(e){setMan(function(v){return Object.assign({},v,{cat:e.target.value});});},style:allCats.reduce?S.inp:S.inp},allCats.map(function(c){return h("option",{key:c.id,value:c.id},c.label);})),
              h("select",{value:man.month,onChange:function(e){setMan(function(v){return Object.assign({},v,{month:e.target.value});});},style:S.inp},sortMonths([...new Set(["May-Jun 2026",...months,...FUTURE_MONTHS])]).map(function(m){return h("option",{key:m,value:m},m);})),
              h("input",{value:man.source,onChange:function(e){setMan(function(v){return Object.assign({},v,{source:e.target.value});});},placeholder:"Source e.g. GTBank",style:S.inp}),
              h("input",{value:man.desc,onChange:function(e){setMan(function(v){return Object.assign({},v,{desc:e.target.value});});},placeholder:"Description",style:Object.assign({},S.inp,{gridColumn:"span 2"})}),
              h("input",{value:man.amount,onChange:function(e){setMan(function(v){return Object.assign({},v,{amount:e.target.value});});},type:"number",placeholder:"Amount NGN",style:S.inp}),
              h("input",{value:man.date,onChange:function(e){setMan(function(v){return Object.assign({},v,{date:e.target.value});});},placeholder:"Date e.g. 12 Jul",style:S.inp}),
              h("input",{value:man.notes||"",onChange:function(e){setMan(function(v){return Object.assign({},v,{notes:e.target.value});});},placeholder:"Notes optional",style:Object.assign({},S.inp,{gridColumn:"span 3"})})
            ),
            h("div",{style:{display:"flex",gap:8}},
              h("button",{onClick:addManual,style:S.btn()},"Add Transaction"),
              h("button",{onClick:function(){setShowMan(false);},style:S.btn("#1a1a38","#94a3b8")},"Cancel")
            )
          ):null,
          ob>0?h("div",{style:{background:"#0d1f0d",border:"1px solid #10b98140",borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h("div",null,
              h("div",{style:{fontSize:10,color:"#64748b",fontWeight:600,textTransform:"uppercase",letterSpacing:1}},"Opening Balance from previous cycle"),
              h("div",{style:{fontSize:16,fontWeight:800,color:"#10b981",marginTop:2}},fmt(ob))
            ),
            h("div",{style:{fontSize:11,color:"#10b981",fontWeight:600}},"Carried forward")
          ):null,
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:14}},
            [{label:"Total Income",val:income,color:"#10b981",clickFn:function(){setDrill("income");}},{label:"Total Expenses",val:expenses,color:"#ef4444",clickFn:null},{label:"Net Balance",val:net,color:net>=0?"#10b981":"#ef4444",clickFn:null}]
            .map(function(c){return h("div",{key:c.label,onClick:c.clickFn||undefined,style:{background:"#111126",borderRadius:14,padding:"16px 18px",border:"1px solid "+(c.clickFn?"#10b98120":"#252540"),cursor:c.clickFn?"pointer":"default"}},
              h("div",{style:{fontSize:9,color:"#64748b",fontWeight:600,letterSpacing:1,textTransform:"uppercase"}},c.label),
              h("div",{style:{fontSize:18,fontWeight:800,color:c.color,marginTop:3}},fmt(c.val)),
              c.clickFn?h("div",{style:{fontSize:9,color:"#475569",marginTop:3}},"click to drill down"):null
            );})
          ),
          income>0?h("div",{style:S.card()},
            h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6}},
              h("span",{style:{fontSize:11,color:"#94a3b8",fontWeight:600}},"Savings Rate"),
              h("span",{style:{fontSize:11,fontWeight:700,color:net>=0?"#10b981":"#ef4444"}},(net/income*100).toFixed(1)+"%")
            ),
            h("div",{style:{background:"#0d0d20",borderRadius:20,height:7,overflow:"hidden"}},
              h("div",{style:{height:"100%",borderRadius:20,width:Math.min(100,Math.max(0,net/income*100))+"%",background:net>=0?"linear-gradient(90deg,#10b981,#34d399)":"#ef4444"}})
            ),
            h("div",{style:{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:10,color:"#475569"}},
              h("span",null,"Target: 20%+ savings rate"),
              net>0?h("button",{onClick:carryForward,style:{background:"#10b98120",border:"1px solid #10b98140",borderRadius:7,color:"#10b981",fontSize:10,cursor:"pointer",padding:"3px 10px",fontWeight:700}},"Carry "+fmt(net)+" Forward"):null
            ),
            prevData?h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10,paddingTop:10,borderTop:"1px solid #1e1e38"}},
              [{label:"vs Last Cycle Income",val:income-prevData.income},{label:"vs Last Cycle Expenses",val:expenses-prevData.expenses}]
              .map(function(x){return h("div",{key:x.label,style:{background:"#0d0d20",borderRadius:8,padding:"8px 10px"}},h("div",{style:{fontSize:9,color:"#64748b",marginBottom:2}},x.label),h("div",{style:{fontSize:11,fontWeight:700,color:x.val>=0?"#10b981":"#ef4444"}},(x.val>=0?"+":"")+fmt(x.val)));})
            ):null
          ):null,
          income>0&&expenses/income>0.9?h("div",{style:{background:"#2a0a0a",border:"1px solid #ef444440",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:11,color:"#fca5a5"}},"Warning: You spent "+(expenses/income*100).toFixed(0)+"% of your income this cycle. Target is below 80%."):null,
          top3.length>0?h("div",{style:S.card()},
            h("div",{style:{fontSize:11,fontWeight:700,color:"#f59e0b",marginBottom:10}},"Top 3 Biggest Transactions This Cycle"),
            top3.map(function(t,i){
              var cat=catMap[t.cat]||{color:"#94a3b8",label:t.cat};
              return h("div",{key:t.id,style:{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:"#0d0d20",borderRadius:8,marginBottom:6}},
                h("div",{style:{fontSize:16,fontWeight:900,color:i===0?"#f59e0b":i===1?"#94a3b8":"#cd7c2f",minWidth:20}},"#"+(i+1)),
                h("div",{style:{flex:1}},h("div",{style:{fontSize:11,color:"#e2e8f0",fontWeight:600}},t.desc),h("div",{style:{fontSize:9,color:"#64748b",marginTop:2}},t.date+" - "+cat.label)),
                h("div",{style:{fontSize:13,fontWeight:800,color:cat.color}},fmt(t.amount))
              );
            })
          ):null,
          h("div",{style:S.card()},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
              h("div",{style:{fontSize:12,fontWeight:700,color:"#a5b4fc"}},"Expense Breakdown - "+month),
              h("span",{style:{fontSize:10,color:"#475569"}},"Click to drill down and reclassify")
            ),
            expCats.filter(function(c){return byCat[c.id];}).length===0?
              h("div",{style:{textAlign:"center",color:"#475569",padding:20}},"No expense data. Upload a statement or add entries manually.")
            :expCats.slice().sort(function(a,b){return (byCat[b.id]||0)-(byCat[a.id]||0);}).map(function(cat){
              var amt=byCat[cat.id]||0;
              if(!amt)return null;
              var pct=expenses>0?(amt/expenses*100):0;
              var count=txns.filter(function(t){return t.month===month&&t.cat===cat.id;}).length;
              var budget=(budgets)[cat.id]||0;
              var over=budget>0&&amt>budget;
              var diffPct=budget>0?Math.abs(((amt-budget)/budget)*100).toFixed(0):0;
              return h("div",{key:cat.id,onClick:function(){setDrill(cat.id);},style:{marginBottom:11,padding:"7px 9px",borderRadius:9,cursor:"pointer",transition:"background 0.1s"},
                onMouseOver:function(e){e.currentTarget.style.background="#0d0d20";},
                onMouseOut:function(e){e.currentTarget.style.background="transparent";}},
                h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}},
                  h("div",{style:{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}},
                    h("span",{style:{fontSize:12,color:"#cbd5e1"}},cat.label),
                    h("span",{style:S.tag(cat.color)},count+" items"),
                    over?h("span",{style:S.tag("#ef4444")},diffPct+"% over budget"):null
                  ),
                  h("div",{style:{display:"flex",gap:10,alignItems:"center"}},
                    h("span",{style:{fontSize:10,color:"#64748b"}},pct.toFixed(1)+"%"),
                    h("span",{style:{fontSize:12,fontWeight:700,color:over?"#ef4444":cat.color}},fmt(amt))
                  )
                ),
                h("div",{style:{background:"#0a0a18",borderRadius:20,height:5}},
                  h("div",{style:{height:"100%",borderRadius:20,width:pct+"%",background:cat.color}})
                ),
                budget>0?h("div",{style:{fontSize:10,marginTop:3,color:over?"#ef4444":"#10b981",fontWeight:600}},
                  over?diffPct+"% over budget ("+fmt(amt-budget)+" over "+fmt(budget)+")":
                  diffPct+"% under budget ("+fmt(budget-amt)+" remaining)"
                ):null
              );
            })
          )
        ):null,
        tab==="investments"?h(InvestmentsTab,{investments:investments,savingsGoals:savingsGoals,invTypes:allInvTypes,onUpdateInv:function(inv){persist({investments:inv});},onUpdateGoals:function(g){persist({savingsGoals:g});},onUpdateTypes:function(t){persist({invTypes:t});}}):null,
        tab==="annual"?h(AnnualTab,{txns:txns,cats:allCats}):null,
        tab==="upload"?h(UploadTab,{apiKey:apiKey,cats:allCats,onConfirm:confirmUpload}):null,
        tab==="backup"?h(BackupTab,{state:state,uploadHistory:uploadHistory,onRestore:function(data){var d=Object.assign({},data);delete d._date;delete d._v;persist(d);}}):null
      ),
      h("div",{style:{width:300,flexShrink:0,overflow:"hidden",display:"flex",flexDirection:"column"}},
        h(AiChat,{txns:txns,cats:allCats,apiKey:apiKey,onSaveKey:saveApiKey})
      )
    )
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
